<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BaseRouter — Direction B · Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Doto:wght@700;900&family=Handjet:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Direction B · Display
   BaseRouter is a small desk device: one LCD that tells you everything,
   and a chunky key per route. A pixel creature lives on the screen.
   Monochrome, with a single blue for "lit" and for the main action. */
:root{
  --desk:#C4C9CF;       /* behind the device (desktop only) */
  --shell:#E2E5E8;      /* device body */
  --key:#F6F7F8;        /* keycaps */
  --key-edge:#B4B9C0;
  --lcd:#C2CEB8;        /* LCD glass */
  --pixel:#1C2A20;      /* LCD ink */
  --ghost:rgba(28,42,32,.11);
  --ink:#16181B;        /* silkscreen */
  --ink-2:#5C6168;
  --blue:#2440F0;       /* the one accent */
  --label:"Archivo",system-ui,sans-serif;
  --dot:"Doto",ui-monospace,monospace;
  --px:"Handjet",ui-monospace,monospace;
}
:root[data-theme="dark"]{
  --desk:#0C0D0F; --shell:#1C1E22; --key:#2B2E34; --key-edge:#0E0F12;
  --lcd:#84E2D2; --pixel:#0C2C29; --ghost:rgba(12,44,41,.13);
  --ink:#F1F2F3; --ink-2:#9BA0A8; --blue:#6E86FF;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--shell);color:var(--ink);font:500 15px/1.35 var(--label);font-stretch:92%;min-height:100dvh;
  -webkit-font-smoothing:antialiased}
button{font:inherit;font-stretch:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

.mockbar{display:flex;gap:8px;align-items:center;padding:8px 14px;font:500 12px/1 system-ui,sans-serif;
  color:var(--ink-2);border-bottom:1px dashed var(--key-edge)}
.mockbar b{color:var(--ink);font-weight:600;margin-right:auto}
.mockbar button{padding:6px 10px;border:1px solid var(--key-edge);border-radius:6px}

.shell{max-width:460px;margin:0 auto;padding:16px 16px 28px}
.brand{display:flex;align-items:center;gap:10px;margin:2px 4px 14px}
.brand b{font:800 19px/1 var(--label);font-stretch:100%;letter-spacing:-.01em}
.grille{margin-left:auto;width:54px;height:18px;
  background:radial-gradient(circle,var(--key-edge) 1.6px,transparent 2px) 0 0/9px 9px}

/* the LCD */
.lcd{background:var(--lcd);color:var(--pixel);border-radius:18px;padding:14px 16px 12px;position:relative;overflow:hidden;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.28),inset 0 0 0 2px rgba(0,0,0,.12),0 1px 0 rgba(255,255,255,.5);
  font:500 19px/1.1 var(--px);letter-spacing:.02em}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:linear-gradient(var(--ghost) 1px,transparent 1px) 0 0/100% 3px}
:root[data-theme="dark"] .lcd{box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 0 46px -6px rgba(132,226,210,.5)}
.stat{display:flex;justify-content:space-between;gap:10px}
.stat span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.link{display:inline-flex;gap:3px}
.link i{width:9px;height:9px;background:var(--pixel)}
.link i.down{background:none;box-shadow:inset 0 0 0 2px var(--pixel)}
.main{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px;margin:12px 0 10px}
.total{font:900 76px/.8 var(--dot);letter-spacing:-.03em;white-space:nowrap}
.total small{display:block;font:500 19px/1.1 var(--px);letter-spacing:.02em;margin-top:12px;white-space:normal}
.pt{display:inline-block;width:.15em;height:.15em;background:currentColor;margin:0 .05em}
.pet{display:grid;justify-items:center;gap:6px;font-size:17px;text-align:center;width:96px}
.pet svg{width:78px;height:66px;fill:var(--pixel);shape-rendering:crispEdges;animation:bob 1.1s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bars{display:flex;align-items:flex-end;gap:4px;height:30px;padding-top:6px;border-top:2px dotted var(--pixel)}
.bars i{flex:1;background:var(--pixel);opacity:.42}
.bars i:last-child{opacity:1}
.tick{margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* address plate */
.plate{display:flex;align-items:center;gap:10px;margin:14px 0 6px;padding:6px 6px 6px 14px;border-radius:14px;
  box-shadow:inset 0 0 0 2px var(--key-edge)}
.plate div{flex:1;min-width:0}
.plate small{display:block;font:500 12.5px/1.2 var(--label);color:var(--ink-2)}
.plate code{display:block;font:700 15px/1.3 var(--label);font-stretch:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{background:var(--key);border-radius:11px;box-shadow:0 4px 0 var(--key-edge),0 7px 10px -5px rgba(0,0,0,.35);
  transition:transform .06s,box-shadow .06s}
.cap:active{transform:translateY(3px);box-shadow:0 1px 0 var(--key-edge)}
.plate .cap{flex:none;height:44px;padding:0 14px;font:700 14px/1 var(--label);margin-bottom:4px}

/* route keys */
.hint{font:500 13px/1.2 var(--label);color:var(--ink-2);margin:16px 4px 10px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.rk{display:grid;grid-template-rows:1fr auto auto;gap:9px;padding:12px 12px 13px;border-radius:16px;min-width:0}
.rk .nm{display:flex;align-items:flex-start;gap:8px;font:700 16px/1.15 var(--label)}
.rk .nm span{min-width:0;overflow-wrap:anywhere}
.led{flex:none;width:11px;height:11px;margin-top:4px;border-radius:50%;background:var(--blue);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent),0 0 10px var(--blue)}
.mini{background:var(--lcd);color:var(--pixel);border-radius:9px;padding:7px 9px 8px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.mini b{display:flex;justify-content:space-between;align-items:baseline;font:900 30px/.9 var(--dot);letter-spacing:-.02em}
.mini b em{font:500 17px/1 var(--px);font-style:normal;letter-spacing:.02em}
.seg{display:block;position:relative;height:8px;margin-top:8px;
  background:repeating-linear-gradient(90deg,var(--ghost) 0 8%,transparent 8% 10%)}
.seg::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,var(--pixel) 0 8%,transparent 8% 10%);
  clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.rk .of{font:500 12.5px/1.2 var(--label);color:var(--ink-2);white-space:nowrap}
.rk.busy .led{animation:blink .9s steps(1) infinite}
.rk.off{box-shadow:0 2px 0 var(--key-edge);transform:translateY(2px);color:var(--ink-2)}
.rk.off .led{background:var(--key-edge);box-shadow:none}
.rk.off .mini{opacity:.55}
.rk.full .led{background:none;box-shadow:inset 0 0 0 3px var(--ink);animation:blink .9s steps(1) infinite}
.rk.full .mini{background:var(--pixel);color:var(--lcd)}
.rk.full .seg{background:repeating-linear-gradient(90deg,var(--lcd) 0 8%,transparent 8% 10%)}
.rk.full .seg::after{display:none}
@keyframes blink{50%{opacity:.25}}

/* function keys */
.fn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:22px}
.fn .cap{min-height:52px;border-radius:26px;padding:0 6px;font:600 13.5px/1.1 var(--label);text-align:center}
.fn .go{grid-column:1/-1;background:var(--blue);color:#fff;font:700 16px/1 var(--label);min-height:56px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 55%,#000),0 7px 10px -5px rgba(0,0,0,.35)}
.fn .go:active{box-shadow:0 1px 0 color-mix(in srgb,var(--blue) 55%,#000)}

@media (min-width:980px){
  body{background:var(--desk)}
  .shell{max-width:1080px;margin:40px auto;padding:30px 34px 34px;background:var(--shell);border-radius:36px;
    display:grid;grid-template-columns:430px 1fr;gap:0 38px;align-items:start;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 10px 0 var(--key-edge),0 50px 70px -40px rgba(0,0,0,.55)}
  .brand{grid-column:1/-1;margin-bottom:20px}
  .left{grid-column:1}.right{grid-column:2;grid-row:2/4}
  .total{font-size:104px}
  .hint{margin-top:0}
  .keys{grid-template-columns:repeat(3,1fr);gap:18px 16px}
  .fn{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mockbar"><b>B · Display / Dijital ekran</b>
  <button id="lang">TR</button><button id="theme">Dark</button></div>

<main class="shell">
  <div class="brand"><b>baserouter</b><span class="grille" aria-hidden="true"></span></div>

  <div class="left">
    <section class="lcd" aria-label="Status">
      <div class="stat">
        <span><span class="link" aria-hidden="true"><i></i><i></i><i class="down"></i></span>
          <span data-tr="3 sağlayıcıdan 2'si açık">2 of 3 providers up</span></span>
        <span data-tr="3 rota açık">3 routes on</span>
      </div>
      <div class="main">
        <div class="total"><span class="num">$1.24</span><small data-tr="bugün harcandı, bu ay $18.60">spent today, $18.60 this month</small></div>
        <div class="pet">
          <svg id="pet" viewBox="0 0 13 11" aria-hidden="true"></svg>
          <span data-tr="her şey yolunda">all good</span>
        </div>
      </div>
      <div class="bars" aria-hidden="true"><i style="height:38%"></i><i style="height:62%"></i><i style="height:30%"></i><i style="height:84%"></i><i style="height:55%"></i><i style="height:70%"></i><i style="height:46%"></i></div>
      <div class="tick" data-tr="kod ajanı &gt; claude-sonnet-5.5  2,1 sn  $0.004">coding agent &gt; claude-sonnet-5.5  2.1 s  $0.004</div>
    </section>

    <div class="plate">
      <div><small data-tr="bütün ajanların bağlandığı tek adres">the one address every agent connects to</small>
        <code>http://localhost:4141/v1</code></div>
      <button class="cap" id="copy" data-tr="kopyala">copy</button>
    </div>
  </div>

  <div class="right">
    <p class="hint" data-tr="rotalar: açıp kapatmak için bas">routes: press to switch on or off</p>
    <div class="keys">
      <button class="cap rk busy"><span class="nm"><i class="led"></i><span data-tr="Kod ajanı">Coding agent</span></span>
        <span class="mini"><b><span class="num">0.51</span><em data-tr="bugün">today</em></b><span class="seg" style="--p:45%"></span></span>
        <span class="of" data-tr="$11.30 / $25 bütçe">$11.30 of $25 budget</span></button>
      <button class="cap rk"><span class="nm"><i class="led"></i><span data-tr="Ev asistanı">Home assistant</span></span>
        <span class="mini"><b><span class="num">0.42</span><em data-tr="bugün">today</em></b><span class="seg" style="--p:62%"></span></span>
        <span class="of" data-tr="$6.20 / $10 bütçe">$6.20 of $10 budget</span></button>
      <button class="cap rk"><span class="nm"><i class="led"></i><span data-tr="Robot kol">Robot arm</span></span>
        <span class="mini"><b><span class="num">0.31</span><em data-tr="bugün">today</em></b><span class="seg" style="--p:22%"></span></span>
        <span class="of" data-tr="$1.10 / $5 bütçe">$1.10 of $5 budget</span></button>
      <button class="cap rk full"><span class="nm"><i class="led"></i><span data-tr="Bülten botu">Newsletter bot</span></span>
        <span class="mini"><b><span class="num">3.00</span><em data-tr="doldu">full</em></b><span class="seg" style="--p:100%"></span></span>
        <span class="of" data-tr="bütçe doldu, durduruldu">budget used up, stopped</span></button>
      <button class="cap rk off"><span class="nm"><i class="led"></i><span data-tr="Bahçe gözcüsü">Garden watcher</span></span>
        <span class="mini"><b><span class="num">-.--</span><em data-tr="kapalı">off</em></b><span class="seg" style="--p:16%"></span></span>
        <span class="of" data-tr="$0.80 / $5 bütçe">$0.80 of $5 budget</span></button>
    </div>
  </div>

  <div class="fn">
    <button class="cap go" data-tr="+ yeni rota">+ new route</button>
    <button class="cap" data-tr="sağlayıcılar">providers</button>
    <button class="cap" data-tr="hareketler">activity</button>
    <button class="cap" data-tr="ayarlar">settings</button>
  </div>
</main>

<script>
// the pixel creature: a little router with two antennas
const map=["..#.......#..","..#.......#..","...#.....#...",".###########.",".#.........#.",".#.##...##.#.",".#.##...##.#.",".#.........#.",".#...###...#.",".###########.","..##.....##.."];
document.getElementById('pet').innerHTML=map.flatMap((r,y)=>[...r].map((c,x)=>c==='#'?`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`:'')).join('');

// Doto draws its full stop as a cross; use a plain square instead
document.querySelectorAll('.num').forEach(n=>n.innerHTML=n.textContent.replace('.','<i class="pt"></i>'));

const q=new URLSearchParams(location.search), root=document.documentElement;
const els=[...document.querySelectorAll('[data-tr]')]; els.forEach(e=>e.dataset.en=e.textContent);
let lang=q.get('lang')||((navigator.language||'').startsWith('tr')?'tr':'en');
let theme=q.get('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function paint(){
  root.lang=lang; root.dataset.theme=theme;
  els.forEach(e=>e.textContent=e.dataset[lang]);
  document.getElementById('lang').textContent=lang==='tr'?'EN':'TR';
  document.getElementById('theme').textContent=theme==='dark'?'Light':'Dark';
}
document.getElementById('lang').onclick=()=>{lang=lang==='tr'?'en':'tr';paint()};
document.getElementById('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';paint()};
document.querySelectorAll('.rk').forEach(k=>k.onclick=()=>{ if(!k.classList.contains('full')) k.classList.toggle('off') });
document.getElementById('copy').onclick=e=>{
  navigator.clipboard?.writeText('http://localhost:4141/v1').catch(()=>{});
  e.currentTarget.textContent=lang==='tr'?'kopyalandı':'copied'; setTimeout(paint,1200);
};
paint();
</script>
</body>
</html>
