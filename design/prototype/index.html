<title>BaseRouter — skin prototype</title>

<style>
/* Only the picker bar is styled here. Everything else comes from the active skin. */
.mockbar{flex-wrap:wrap}
.mockbar i{flex:1}

</style>
</head>

<!-- URL parameters: skin=socket|display|home  state=default|calm|empty  lang=en|tr  theme=light|dark  bar=0 -->
