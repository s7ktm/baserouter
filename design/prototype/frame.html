<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BaseRouter — phone frame</title>
<style>
/* Shows one page at phone size, centred, with nothing around it. Used for taking
   screenshots: headless Chrome cannot open a window as narrow as a phone.
   frame.html?src=<url-encoded address, relative to this folder> */
html,body{margin:0;height:100%;background:#fff}
iframe{display:block;width:390px;height:844px;border:0;margin:0 auto}
</style>
</head>
<body>
<iframe id="page" title="page"></iframe>
<script>
document.getElementById("page").src = new URLSearchParams(location.search).get("src") || "index.html?bar=0";
</script>
</body>
</html>
