<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaseRouter — cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@500;600&family=Archivo:wdth,wght@92,800&family=Gabarito:wght@800&display=swap" rel="stylesheet">
<style>
/* The README and social cover: a 1280 x 640 artboard, scaled down to fit the window. */
*{box-sizing:border-box;margin:0}
body{background:#DDDDD9;min-height:100dvh;display:grid;place-items:start center;padding:24px 0;overflow-x:hidden}
.fit{width:1280px;height:640px;transform-origin:top center}
/* ?export=1: the artboard alone, at its own size, for taking the image */
.export{display:block;padding:0;background:none}
.cover{width:1280px;height:640px;display:grid;grid-template-columns:548px repeat(3,1fr);font-family:"Instrument Sans",system-ui,sans-serif;overflow:hidden}

.word{background:#1C2030;color:#FBFBF8;padding:60px 56px;display:grid;grid-template-rows:auto 1fr auto;align-content:start}
.word svg{width:76px;height:76px}
.word h1{font:800 82px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.025em;margin-top:26px}
.word p{font:500 29px/1.3 "Instrument Sans",system-ui,sans-serif;color:#C6CAD4;margin-top:22px;max-width:14.5em}
.word small{font:600 20px/1.3 "Instrument Sans",system-ui,sans-serif;color:#FFC531;align-self:end}

.look{display:grid;grid-template-rows:1fr auto;justify-items:center;padding:0 12px 44px;color:#1C2030}
.look .mascot{width:192px;height:192px;align-self:center;margin-top:40px;overflow:visible}
.look span{font-size:30px;line-height:1}
.socket{background:#E6E9EE}
.socket span{font:800 32px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em}
.display{background:#C2CEB8;color:#1C2A20}
.display span{font:800 32px/1 "Archivo",system-ui,sans-serif;font-stretch:92%}
.home{background:#D6E6F6;color:#33213F}
.home span{font:800 32px/1 "Gabarito",system-ui,sans-serif}
</style>
</head>
<body>
<div class="fit" id="fit">
  <div class="cover">
    <div class="word">
      <span id="mark"></span>
      <div><h1>BaseRouter</h1>
        <p>Plug in your providers, use one address, see what every route spends.</p></div>
      <small>A self-hosted AI gateway in three looks</small>
    </div>
    <div class="look socket" data-skin="socket" data-mood="happy"><span>Socket</span></div>
    <div class="look display" data-skin="display" data-mood="happy"><span>display</span></div>
    <div class="look home" data-skin="home" data-mood="busy"><span>Home</span></div>
  </div>
</div>
<script type="module">
for (const panel of document.querySelectorAll(".look")) {
  const { mascot } = await import(`./skins/${panel.dataset.skin}/mascot.js`);
  panel.insertAdjacentHTML("afterbegin", mascot(panel.dataset.mood));
}
document.getElementById("mark").innerHTML = (await import("./skins/socket/mascot.js")).icon;

const exporting = new URLSearchParams(location.search).has("export");
document.body.classList.toggle("export", exporting);
const fit = () => {
  if (exporting) return;
  const scale = Math.min(1, (innerWidth - 32) / 1280);
  const el = document.getElementById("fit");
  el.style.transform = `scale(${scale})`;
  el.style.marginBottom = `${-640 * (1 - scale)}px`;
};
addEventListener("resize", fit);
fit();
</script>
</body>
</html>
