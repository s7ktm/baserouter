<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaseRouter — skin check</title>
<style>
/* Every skin in every state, side by side, plus the contract result. Deliberately plain. */
:root{--bg:#F1F1EF;--fg:#1B1B1F;--mute:#63636B;--line:#CFCFD4;--ok:#1E7F4B;--bad:#C0321F}
:root[data-theme="dark"]{--bg:#111114;--fg:#F2F2F4;--mute:#A0A0AA;--line:#34343C;--ok:#5FD397;--bad:#FF8A78}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1230px;margin:0 auto 8px}
h1{font-size:20px;font-weight:650;margin-right:auto}
header button{font:inherit;font-size:13px;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
section{max-width:1230px;margin:28px auto 0}
h2{font-size:17px;font-weight:650}
.result{font-size:14px;margin:4px 0 0;color:var(--ok)}
.row{margin-top:12px}
.result.bad{color:var(--bad)}
.result ul{margin:4px 0 0 18px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
figure{margin:0}
figcaption{font-size:13px;color:var(--mute);margin-bottom:6px}
iframe{display:block;width:100%;height:760px;border:1px solid var(--line);border-radius:24px;background:#fff}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <button id="lang"></button><button id="theme"></button>
</header>
<div id="sheet"></div>
<script type="module">
import { registry } from "./skins/registry.js";
import { checkSkin, TOKENS } from "./core/contract.js";
import { states } from "./core/data.js";

const words = {
  en: { providers: "Providers", add: "Adding a provider: a rejected key", made: "A new route, first request arrived", activity: "Activity", images: "Kept images", sounds: "Kept sounds", image: "One image, about to be deleted", sound: "One sound", videos: "Kept videos", video: "One video", pick: "Adding a model", pickNone: "Model search, nothing found", pickNew: "A new route, choosing its model", where: "Where a route's model comes from", settings: "Settings", signin: "Signing in: a wrong password", newkey: "A route's new key, shown once", delete: "Deleting a route", password: "Changing the password", route: "A route, opened", over: "A route over budget", title: "Every skin, every state", ok: "Meets the contract", bad: "Does not meet the contract:", tokens: "All {n} shared tokens are defined", noTokens: "Shared tokens not defined:", default: "A normal day", calm: "Nothing needs attention", empty: "First run" },
  tr: { providers: "Sağlayıcılar", add: "Sağlayıcı ekleme: reddedilen anahtar", made: "Yeni rota, ilk istek geldi", activity: "Hareketler", images: "Saklanan görseller", sounds: "Saklanan sesler", image: "Bir görsel, silinmek üzere", sound: "Bir ses", videos: "Saklanan videolar", video: "Bir video", pick: "Model ekleme", pickNone: "Model araması, sonuç yok", pickNew: "Yeni rota, model seçimi", where: "Rotadaki modelin sağlayıcısı", settings: "Ayarlar", signin: "Giriş: yanlış parola", newkey: "Rotanın yeni anahtarı, bir kez", delete: "Rota silme", password: "Parola değiştirme", route: "Açılmış bir rota", over: "Bütçesi dolmuş bir rota", title: "Her görünüm, her durum", ok: "Sözleşmeyi karşılıyor", bad: "Sözleşmeyi karşılamıyor:", tokens: "{n} ortak değişkenin hepsi tanımlı", noTokens: "Tanımlanmamış ortak değişkenler:", default: "Sıradan bir gün", calm: "Her şey yolunda", empty: "İlk açılış" },
};
const query = new URLSearchParams(location.search);
// Only known values: these go into the page's markup.
let lang = ["en", "tr"].includes(query.get("lang")) ? query.get("lang") : (navigator.language || "").startsWith("tr") ? "tr" : "en";
let theme = ["light", "dark"].includes(query.get("theme")) ? query.get("theme") : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
const skins = await Promise.all(registry.map(async (id) => (await import(`./skins/${id}/skin.js`)).default));

function paint() {
  const w = words[lang];
  document.documentElement.lang = lang;
  document.documentElement.dataset.theme = theme;
  document.getElementById("title").textContent = w.title;
  document.getElementById("lang").textContent = lang === "tr" ? "EN" : "TR";
  document.getElementById("theme").textContent = theme === "dark" ? "Light" : "Dark";
  document.getElementById("sheet").innerHTML = skins.map((skin) => {
    const problems = checkSkin(skin);
    const result = problems.length
      ? `<div class="result bad">${w.bad}<ul>${problems.map((p) => `<li>${p}</li>`).join("")}</ul></div>`
      : `<div class="result">${w.ok}</div>`;
    const views = [...Object.keys(states).map((state) => [state, `state=${state}`]), ["route", "route=home"], ["over", "route=news"],
      ["providers", "screen=providers"], ["add", "screen=add-provider&kind=openrouter&step=fail&flow=1"],
      ["made", "screen=new-route&step=arrived&flow=1"], ["activity", "screen=activity"], ["images", "screen=activity&show=images"], ["image", "screen=activity&media=i1&edit=delete-media"], ["sounds", "screen=activity&show=sounds"], ["sound", "screen=activity&media=a1"], ["videos", "screen=activity&show=videos"], ["video", "screen=activity&media=v1"], ["pick", "route=coding&edit=model"], ["pickNone", "route=coding&edit=model&find=zzzz"], ["pickNew", "screen=new-route&edit=model&makes=video"], ["where", "route=coding&edit=provider&line=0"], ["settings", "screen=settings"],
      ["signin", "state=empty&screen=sign-in&step=fail"], ["newkey", "route=home&edit=key&step=made"], ["delete", "route=home&edit=delete"],
      ["password", "screen=settings&edit=password"]];
    const frames = views.map(([label, params]) =>
      `<figure><figcaption>${w[label] ?? label}</figcaption>
       <iframe loading="lazy" title="${skin.id} ${label}" src="index.html?skin=${skin.id}&${params.includes("state=") ? params : `state=default&${params}`}&lang=${lang}&theme=${theme}&bar=0"></iframe></figure>`).join("");
    return `<section data-skin="${skin.id}"><h2>${skin.name[lang]}</h2>${result}<div class="result" data-tokens></div><div class="row">${frames}</div></section>`;
  }).join("");
  document.querySelectorAll("section[data-skin]").forEach(checkTokens);
}

// Read the skin's stylesheet and look for each token's definition. This does not
// depend on any frame having loaded, so it also works for skins further down the page.
async function checkTokens(section) {
  const css = await (await fetch(`skins/${section.dataset.skin}/skin.css`)).text();
  const missing = TOKENS.filter((token) => !css.includes(token + ":"));
  const out = section.querySelector("[data-tokens]");
  if (!out) return;
  out.classList.toggle("bad", missing.length > 0);
  out.textContent = missing.length ? `${words[lang].noTokens} ${missing.join(", ")}` : words[lang].tokens.replace("{n}", TOKENS.length);
}
document.getElementById("lang").onclick = () => { lang = lang === "tr" ? "en" : "tr"; paint(); };
document.getElementById("theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; paint(); };
paint();
</script>
</body>
</html>
